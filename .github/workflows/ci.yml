name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build shared contract
        run: npm run build -w @rate-limiter/shared

      - name: Build backend and frontend
        run: npm run build -w rate-limiter-backend && npm run build -w rate-limiter-frontend

      - name: Run tests
        run: npm test
        env:
          REDIS_URL: redis://localhost:6379
